name: release
# Publishes a release for the version in manifest.json. Run it from the
# Actions tab ("Run workflow"), or push a matching tag such as v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release tag from manifest version
        run: |
          tag="v$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $tag"; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - run: npm test
      - name: Build zip
        run: |
          name="open-page-watcher-$TAG"
          mkdir -p "dist/$name"
          cp -r manifest.json src icons LICENSE README.md "dist/$name/"
          (cd dist && zip -rq "$name.zip" "$name" && sha256sum "$name.zip" > "$name.zip.sha256")
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="open-page-watcher-$TAG"
          cat > notes.md <<NOTES
          ## Install

          1. Download **$name.zip** below and unzip it.
          2. Open \`chrome://extensions\` and turn on **Developer mode**.
          3. Click **Load unpacked** and choose the unzipped \`$name\` folder.

          The zip contains exactly the files in this tag's \`manifest.json\`, \`src/\` and \`icons/\`, with no build step. Verify it with:

          \`\`\`
          sha256sum -c $name.zip.sha256
          \`\`\`
          NOTES
          gh release create "$TAG" "dist/$name.zip" "dist/$name.zip.sha256" \
            --target "$GITHUB_SHA" --title "Open Page Watcher $TAG" --notes-file notes.md --generate-notes
