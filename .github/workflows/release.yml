name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }
      - run: npm test
      - name: Build zip
        run: |
          name="open-page-watcher-$GITHUB_REF_NAME"
          mkdir -p "dist/$name"
          cp -r manifest.json src icons LICENSE README.md "dist/$name/"
          (cd dist && zip -rq "$name.zip" "$name" && sha256sum "$name.zip" > "$name.zip.sha256")
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="open-page-watcher-$GITHUB_REF_NAME"
          cat > notes.md <<NOTES
          ## Install

          1. Download **$name.zip** below and unzip it.
          2. Open \`chrome://extensions\` and turn on **Developer mode**.
          3. Click **Load unpacked** and choose the unzipped \`$name\` folder.

          The zip contains exactly the files in this tag's \`manifest.json\`, \`src/\` and \`icons/\`, with no build step. Verify it with:

          \`\`\`
          sha256sum -c $name.zip.sha256
          \`\`\`
          NOTES
          gh release create "$GITHUB_REF_NAME" "dist/$name.zip" "dist/$name.zip.sha256" \
            --title "Open Page Watcher $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
